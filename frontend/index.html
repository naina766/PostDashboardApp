<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />

    <!-- Apply theme before paint to avoid light/dark flash -->
    <script>
      (function () {
        try {
          var pref =
            localStorage.getItem("posthub_theme_preference") ||
            localStorage.getItem("posthub-theme") ||
            localStorage.getItem("posthub_theme") ||
            "system";
          var theme = pref;
          if (pref === "system") {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          if (theme !== "dark" && theme !== "light") theme = "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-bs-theme", theme);
          if (theme === "dark") {
            document.documentElement.style.backgroundColor = "#07111F";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO Meta Tags -->
    <title>PostHub — Modern Social Community Platform for Creators & Developers</title>
    <meta
      name="description"
      content="PostHub is a modern social post management and community platform to share updates, rich media, interactive polls, discussions, and creator analytics."
    />
    <meta name="keywords" content="social, community, developers, creators, posts, discussions, analytics" />
    <meta name="author" content="PostHub Engineering" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PostHub" />
    <meta property="og:title" content="PostHub — Modern Social Community Platform" />
    <meta
      property="og:description"
      content="Share rich media posts, participate in community polls, engage in discussions, and track creator performance on PostHub."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PostHub — Modern Social Community Platform" />
    <meta
      name="twitter:description"
      content="A scalable social platform for creators, developers, and communities."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
